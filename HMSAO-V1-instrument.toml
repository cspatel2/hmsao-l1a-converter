# Instrument Configuration Parameters

name = "HMSAO-V1" # instrument name
sigma = "98.76 1 / mm" # groove density (grooves/mm)
# Collimating lens parameters
alpha_ofst = "-69.45 deg" # grating alpha angle offset (deg)
gamma_ofst = "-0.03 deg" # grating gamma angle offset (deg)
toolbox_version = "0.0.2.dev91+gb69052f88" # version of the toolbox used to create this instrument

[col_lens]
fl = "428.0 mm" # focal length (mm)
distance = "100.0 mm" # distance from lens to grating pivot (mm)
# lens offset from nominal position
rotation = "-5.0 deg" # lens rotation (deg)

[col_lens.ofst]
x = "-8.3 mm" # x offset from nominal position
y = "0.0 mm" # y offset from nominal position

[slits.BL]
x = "29.0 mm" # slit X center (mm)
y = "-16.625 mm" # slit Y center (mm)
width = "0.1 mm" # slit width (mm)
height = "33.25 mm" # slit height (mm)
ranges = [["3150.0 Angstrom", "4450.0 Angstrom"], ["7000.0 Angstrom", "8000.0 Angstrom"]] # wavelength ranges (Angstrom)

[slits.BR]
x = "0.0 mm" # slit X center (mm)
y = "-16.625 mm" # slit Y center (mm)
width = "0.1 mm" # slit width (mm)
height = "33.25 mm" # slit height (mm)
ranges = [["4950.0 Angstrom", "10000.0 Angstrom"]] # wavelength ranges (Angstrom)

[slits.TL]
x = "29.0 mm" # slit X center (mm)
y = "16.6249 mm" # slit Y center (mm)
width = "0.1 mm" # slit width (mm)
height = "33.25 mm" # slit height (mm)
ranges = [["5900.0 Angstrom", "10000.0 Angstrom"]] # wavelength ranges (Angstrom)

[slits.TR]
x = "0.0 mm" # slit X center (mm)
y = "16.625 mm" # slit Y center (mm)
width = "0.1 mm" # slit width (mm)
height = "33.25 mm" # slit height (mm)
ranges = [["4350.0 Angstrom", "5000.0 Angstrom"]] # wavelength ranges (Angstrom)

[mosaic]
x = "-3.0 deg" # mosaic X center (deg)
y = "0.0 mm" # mosaic Y center offset (mm)
width = "52.5 mm" # mosaic width (mm)
height = "58.98 mm" # mosaic height (mm)
# mosaic windows (filters)
scale = "15.2718 um" # mosaic plate scale (mm/pixel). Same as camera pixel size if camera is at mosaic

[[mosaic.windows]]
x = "3.0 mm" # filter X from mosaic corner origin (mm)
y = "1.94 mm" # filter Y from mosaic corner origin (mm)
width = "24.89 mm" # filter width (mm)
height = "26.96 mm" # filter height (mm)
ranges = [["6375.0 Angstrom", "6688.0 Angstrom"]] # wavelength ranges (Angstrom)
name = "Hα" # filter name

[[mosaic.windows]]
x = "27.89 mm" # filter X from mosaic corner origin (mm)
y = "1.94 mm" # filter Y from mosaic corner origin (mm)
width = "24.63 mm" # filter width (mm)
height = "26.96 mm" # filter height (mm)
ranges = [["4810.0 Angstrom", "4911.0 Angstrom"]] # wavelength ranges (Angstrom)
name = "Hβ" # filter name

[[mosaic.windows]]
x = "3.0 mm" # filter X from mosaic corner origin (mm)
y = "28.9 mm" # filter Y from mosaic corner origin (mm)
width = "25.89 mm" # filter width (mm)
height = "26.96 mm" # filter height (mm)
ranges = [["7724.0 Angstrom", "7824.0 Angstrom"]] # wavelength ranges (Angstrom)
name = "7774" # filter name

[[mosaic.windows]]
x = "28.98 mm" # filter X from mosaic corner origin (mm)
y = "28.9 mm" # filter Y from mosaic corner origin (mm)
width = "7.5 mm" # filter width (mm)
height = "26.96 mm" # filter height (mm)
ranges = [["6270.0 Angstrom", "6370.0 Angstrom"]] # wavelength ranges (Angstrom)
name = "6300" # filter name

[[mosaic.windows]]
